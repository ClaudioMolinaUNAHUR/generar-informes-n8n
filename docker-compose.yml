services:

  postgres:
    image: postgres:15-alpine3.22
    container_name: n8n-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: n8n
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "30227:5678"
    environment:
      # General
      NODE_ENV: production
      GENERIC_TIMEZONE: Europe/Warsaw
      WEBHOOK_URL: "http://localhost:30227/"
      WEBHOOK_TUNNEL_URL: "http://n8n.local/"

      # Database — PostgreSQL
      DB_TYPE: postgresdb
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_PASSWORD: n8n

      # Basic Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: n8n
      N8N_BASIC_AUTH_PASSWORD: n8n

      # Encryption key (mantener igual si ya hay datos encriptados)
      N8N_ENCRYPTION_KEY: cdd62329-360e-4738-9f57-d97449dd90fa

      # Python Task Runner — apunta al servicio libreoffice (puerto 8000 del contenedor)
      N8N_PYTHON_TASK_RUNNER_URL: "http://libreoffice:8000"
    volumes:
      # Volumen compartido con libreoffice (plantillas, PDFs, config, charts)
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    user: "1000:1000"

  libreoffice:
    build:
      context: ./libreoffice-python
      dockerfile: Dockerfile
    image: api-libreoffice-python:latest
    pull_policy: build
    container_name: n8n-libreoffice
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./libreoffice-python:/app
      - libreoffice-tmp:/tmp
    environment:
      TZ: Europe/Warsaw
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


volumes:
  postgres-data:
    driver: local

  libreoffice-tmp:
    driver: local
