---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreoffice-deployment
  namespace: n8n-project
  labels: &labels
    app: libreoffice
    component: deployment
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc
      - name: app-code
        persistentVolumeClaim:
          claimName: libreoffice-code-pvc
      - name: tmp-volume
        emptyDir: {}
      containers:
      - name: libreoffice
        image: docker.io/claudito16/api-libreoffice-python:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: n8n-data
          mountPath: /data
        - name: app-code
          mountPath: /app
        - name: tmp-volume
          mountPath: /tmp
        
        # 1. STARTUP PROBE: Solo se ejecuta al encender el contenedor. 
        # Le da hasta 5 minutos (30 x 10s) para iniciar correctamente.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10

        # 2. LIVENESS PROBE: ¡ELIMINADO!
        # Al no estar presente, Kubernetes JAMÁS reiniciará el Pod 
        # de forma imprevista durante una conversión larga o costosa.

        # 3. READINESS PROBE: Sigue activo pero muy relajado.
        # Si el pod se satura procesando, se retira temporalmente del balanceador
        # para que no le lleguen nuevas peticiones de n8n hasta que termine, 
        # pero mantiene el proceso actual vivo en paz.
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 20
          failureThreshold: 5

        # 4. RECURSOS ENFOCADOS EN RENDIMIENTO:
        # Asignamos 2 vCPUs dedicadas y elevamos la memoria a 4Gi (4096Mi)
        # para evitar cuellos de botella y errores de Out-Of-Memory (OOM).
        resources:
          limits:
            cpu: "2.0"
            memory: "4096Mi"
          requests:
            cpu: "1.0"
            memory: "2048Mi"