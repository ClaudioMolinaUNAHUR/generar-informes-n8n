---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: libreoffice-deployment
  namespace: n8n-project
  labels: &labels
    app: libreoffice
    component: deployment
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc
      - name: app-code
        persistentVolumeClaim:
          claimName: libreoffice-code-pvc
      - name: tmp-volume
        emptyDir: {}
      containers:
      - name: libreoffice
        image: docker.io/claudito16/api-libreoffice-python:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: n8n-data
          mountPath: /data
        - name: app-code
          mountPath: /app
        - name: tmp-volume
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1.0"
            memory: "1024Mi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
